<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>职引 · 校园就业智能体 — 交互原型</title>
<style>
  :root {
    --brand-1: #0ea5a4;
    --brand-2: #2563eb;
    --brand-grad: linear-gradient(135deg, #0ea5a4 0%, #2563eb 100%);
    --bg: #eef2f7;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --ok: #10b981;
    --warn: #f59e0b;
    --bad: #ef4444;
    --radius: 16px;
    --shadow: 0 4px 24px rgba(15, 23, 42, .08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }

  .phone {
    width: 420px; max-width: 100%;
    height: 860px; max-height: calc(100vh - 40px);
    background: var(--card);
    border-radius: 28px;
    box-shadow: 0 24px 70px rgba(15, 23, 42, .18);
    display: flex; flex-direction: column;
    overflow: hidden; position: relative;
  }

  .topbar {
    background: var(--brand-grad); color: #fff;
    padding: 16px 18px;
    display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  }
  .logo {
    width: 40px; height: 40px; border-radius: 12px;
    background: rgba(255,255,255,.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; backdrop-filter: blur(4px);
  }
  .topbar .meta { flex: 1; min-width: 0; }
  .topbar h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: .3px; }
  .topbar p { margin: 2px 0 0; font-size: 11.5px; opacity: .85; }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #4ade80; display: inline-block; margin-right: 4px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(74,222,128,.7); }
    70%  { box-shadow: 0 0 0 7px rgba(74,222,128,0); }
    100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); }
  }

  .chat {
    flex: 1; overflow-y: auto;
    padding: 18px 16px 8px;
    background:
      radial-gradient(circle at 10% 0%, rgba(14,165,164,.06), transparent 45%),
      radial-gradient(circle at 90% 10%, rgba(37,99,235,.06), transparent 45%);
  }
  .chat::-webkit-scrollbar { width: 5px; }
  .chat::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

  .row { display: flex; margin-bottom: 14px; animation: rise .32s ease both; }
  .row.me { justify-content: flex-end; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .avatar {
    width: 30px; height: 30px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; margin-right: 8px;
    background: var(--brand-grad); color: #fff;
  }
  .bubble {
    max-width: 84%; padding: 11px 14px; border-radius: 14px;
    font-size: 13.5px; line-height: 1.68;
    white-space: pre-wrap; word-break: break-word;
  }
  .row.bot .bubble {
    background: #f8fafc; border: 1px solid var(--line);
    border-top-left-radius: 4px;
    box-shadow: 0 1px 2px rgba(15,23,42,.03);
  }
  .row.me .bubble {
    background: var(--brand-grad); color: #fff;
    border-top-right-radius: 4px;
    box-shadow: 0 4px 14px rgba(37,99,235,.25);
  }

  /* ---------- 报告卡片 ---------- */
  .report {
    background: #fff; border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px 15px;
    box-shadow: var(--shadow); max-width: 92%; font-size: 13px;
  }
  .report-title {
    font-size: 14px; font-weight: 700; margin-bottom: 12px;
    display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
  }
  .report-title .tag {
    font-size: 10.5px; font-weight: 500; padding: 2px 7px;
    border-radius: 20px; background: #e0f2fe; color: #0369a1;
  }
  .big-score { display: flex; align-items: baseline; gap: 6px; margin-bottom: 14px; }
  .big-score .num {
    font-size: 32px; font-weight: 800; letter-spacing: -1px;
    background: var(--brand-grad);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .big-score .unit { font-size: 13px; color: var(--muted); }

  .metric { margin-bottom: 11px; }
  .metric:last-child { margin-bottom: 0; }
  .metric-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; color: var(--muted); margin-bottom: 4px; gap: 8px;
  }
  .metric-head b { color: var(--text); font-size: 12.5px; flex-shrink: 0; }
  .metric-head .note { flex: 1; text-align: right; font-size: 11px; }
  .metric-head .score { font-weight: 700; font-size: 13px; flex-shrink: 0; }
  .bar { height: 7px; border-radius: 5px; background: #eef2f7; overflow: hidden; }
  .bar > i {
    display: block; height: 100%; border-radius: 5px; width: 0;
    background: var(--brand-grad);
    transition: width 1.1s cubic-bezier(.22,.8,.3,1);
  }
  .bar.ok   > i { background: linear-gradient(90deg,#10b981,#34d399); }
  .bar.warn > i { background: linear-gradient(90deg,#f59e0b,#fbbf24); }
  .bar.bad  > i { background: linear-gradient(90deg,#ef4444,#f87171); }

  .tip {
    margin-top: 13px; padding: 11px 12px;
    background: #f0fdfa; border-left: 3px solid var(--brand-1);
    border-radius: 0 10px 10px 0; font-size: 12.5px; line-height: 1.7;
  }
  .tip b { color: #0f766e; }
  .tip .idx {
    display: inline-flex; width: 17px; height: 17px; border-radius: 50%;
    background: var(--brand-1); color: #fff; font-size: 10.5px;
    align-items: center; justify-content: center; margin-right: 5px;
    font-weight: 700; vertical-align: 1px;
  }
  .tip .ex { color: #0f766e; background: #ccfbf1; padding: 1px 5px; border-radius: 5px; }
  .src {
    margin-top: 11px; padding-top: 9px; border-top: 1px dashed var(--line);
    font-size: 11px; color: var(--muted); line-height: 1.6;
  }

  /* ---------- 岗位卡片 ---------- */
  .job {
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 13px; margin-bottom: 9px;
    box-shadow: 0 1px 3px rgba(15,23,42,.04);
    transition: transform .18s, box-shadow .18s;
  }
  .job:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(15,23,42,.09); }
  .job-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .job-name { font-size: 13.5px; font-weight: 700; }
  .job-sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .job-score { font-size: 17px; font-weight: 800; color: var(--brand-2); flex-shrink: 0; }
  .job-score small { font-size: 10px; font-weight: 500; color: var(--muted); }
  .job-line { font-size: 11.5px; margin-top: 8px; line-height: 1.65; }
  .job-line .k { color: var(--ok); font-weight: 600; }
  .job-line .w { color: var(--warn); font-weight: 600; }

  /* ---------- 输入区 ---------- */
  .composer {
    flex-shrink: 0; border-top: 1px solid var(--line);
    background: #fff; padding: 10px 14px 14px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
  .chip {
    font-size: 11.5px; padding: 6px 11px; border-radius: 20px;
    background: #f1f5f9; border: 1px solid var(--line); color: #334155;
    cursor: pointer; transition: all .18s; user-select: none;
  }
  .chip:hover { background: #e0f2fe; border-color: #7dd3fc; color: #0369a1; transform: translateY(-1px); }
  .chip:active { transform: scale(.97); }
  .input-row { display: flex; gap: 9px; align-items: center; }
  .input-row input {
    flex: 1; border: 1px solid var(--line); border-radius: 22px;
    padding: 11px 15px; font-size: 13px; outline: none;
    background: #f8fafc; transition: all .2s; font-family: inherit;
  }
  .input-row input:focus {
    background: #fff; border-color: #7dd3fc;
    box-shadow: 0 0 0 3px rgba(125,211,252,.25);
  }
  .send {
    width: 42px; height: 42px; border-radius: 50%; border: none; flex-shrink: 0;
    background: var(--brand-grad); color: #fff; font-size: 17px;
    cursor: pointer; transition: transform .18s, opacity .18s;
    display: flex; align-items: center; justify-content: center;
  }
  .send:hover { transform: scale(1.06); }
  .send:active { transform: scale(.94); }
  .send:disabled { opacity: .45; cursor: not-allowed; transform: none; }

  .typing { display: flex; gap: 4px; padding: 4px 2px; }
  .typing i {
    width: 6px; height: 6px; border-radius: 50%; background: #94a3b8;
    animation: blink 1.3s infinite both;
  }
  .typing i:nth-child(2) { animation-delay: .18s; }
  .typing i:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%,80%,100% { opacity: .3; } 40% { opacity: 1; } }

  .mock-note {
    position: absolute; top: 12px; right: 12px;
    background: rgba(15,23,42,.72); color: #fff;
    font-size: 10px; padding: 4px 9px; border-radius: 20px;
    letter-spacing: .5px; z-index: 10;
  }

  @media (max-width: 460px) {
    body { padding: 0; }
    .phone { width: 100%; height: 100vh; max-height: none; border-radius: 0; }
    .mock-note { display: none; }
  }


  /* ---------- 与平台输出对齐的样式（v2） ---------- */
  .concl { background:#f0fdfa; border-left:3px solid var(--brand-1); border-radius:0 8px 8px 0;
           padding:9px 11px; margin:4px 0 12px; font-size:12.5px; line-height:1.7; }
  .concl b { color:#0f766e; }
  .jobtable { width:100%; border-collapse:collapse; font-size:11.5px; margin:2px 0 10px; }
  .jobtable th, .jobtable td { padding:7px 6px; border-bottom:1px solid #eef2f7;
           text-align:left; vertical-align:top; }
  .jobtable th { background:#f6fbfb; color:#0f766e; font-weight:600; white-space:nowrap; }
  .jobtable td.idx { color:#94a3b8; font-weight:700; }
  .jobtable td.sc { white-space:nowrap; font-weight:800; color:var(--brand-2); }
  .jobtable .jn { font-weight:600; }
  .jobtable .js { color:#94a3b8; font-size:10.5px; margin-top:2px; }
  .tier { font-size:10px; font-weight:600; padding:1px 5px; border-radius:999px; margin-left:4px; }
  .tier.ok { background:#dcfce7; color:#15803d; }
  .tier.warn { background:#fef3c7; color:#b45309; }
  .tier.bad { background:#fee2e2; color:#b91c1c; }
  .retry { display:inline-block; margin-top:8px; padding:4px 10px; border-radius:999px;
           background:#eef2ff; color:#3730a3; font-size:11.5px; font-weight:600; }
</style>
</head>
<body>
<div class="phone">
  <div class="mock-note">交互原型 · 非真实运行</div>
  <div class="topbar">
    <div class="logo">🎯</div>
    <div class="meta">
      <h1>职引 · 校园就业智能体</h1>
      <p><span class="status-dot"></span>在线 · 简历诊断 / 岗位匹配 / 模拟面试 / 成长档案</p>
    </div>
  </div>
  <div class="chat" id="chat"></div>
  <div class="composer">
    <div class="chips" id="chips"></div>
    <div class="input-row">
      <input id="input" placeholder="说点什么…" autocomplete="off">
      <button class="send" id="send">➤</button>
    </div>
  </div>
</div>
<script>
/* ============================================================
   职引 · 交互原型（纯前端演示，数据为示例数据）
   ============================================================ */
const chat = document.getElementById('chat');
const chipsEl = document.getElementById('chips');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');

const CHIPS = ['📄 帮我诊断简历', '🔍 帮我匹配岗位', '🎤 来一场模拟面试',
               '🔁 重练第 3 题', '📈 我的进步', '📋 三方协议怎么签？'];
const sleep = ms => new Promise(r => setTimeout(r, ms));
let t0 = '';   /* 本轮用户输入，供场景内部取编号用 */

/* ---------- 基础渲染 ---------- */
function scrollDown() { requestAnimationFrame(() => chat.scrollTop = chat.scrollHeight); }

function addUser(text) {
  const row = document.createElement('div');
  row.className = 'row me';
  row.innerHTML = '<div class="bubble"></div>';
  row.querySelector('.bubble').textContent = text;
  chat.appendChild(row); scrollDown();
}

function addBot(html, isHtml = false) {
  const row = document.createElement('div');
  row.className = 'row bot';
  row.innerHTML = '<div class="avatar">🎯</div><div class="bubble"></div>';
  const b = row.querySelector('.bubble');
  if (isHtml) {
    b.style.background = 'transparent';
    b.style.border = 'none';
    b.style.padding = '0';
    b.style.boxShadow = 'none';
    b.style.maxWidth = '92%';
    b.innerHTML = html;
  } else { b.textContent = html; }
  chat.appendChild(row); scrollDown();
  return row;
}

async function showTyping(ms = 700) {
  const row = addBot('');
  row.querySelector('.bubble').innerHTML = '<div class="typing"><i></i><i></i><i></i></div>';
  await sleep(ms);
  row.remove();
}

/* ---------- 进度条 ---------- */
function barClass(score) { return score >= 80 ? 'ok' : score >= 60 ? 'warn' : 'bad'; }
function metric(label, score, note) {
  return '<div class="metric">'
    + '<div class="metric-head"><b>' + label + '</b>'
    + '<span class="note">' + (note || '') + '</span>'
    + '<span class="score">' + score + '</span></div>'
    + '<div class="bar ' + barClass(score) + '"><i data-w="' + score + '"></i></div>'
    + '</div>';
}
function animateBars(scope) {
  requestAnimationFrame(() => {
    scope.querySelectorAll('.bar > i').forEach(el => { el.style.width = (el.dataset.w || 0) + '%'; });
  });
}

/* ---------- 场景 1：简历诊断 ---------- */
function reportResume() {
  return '<div class="report">'
    + '<div class="report-title">📊 简历诊断报告 <span class="tag">目标岗位：化工工艺工程师</span></div>'
    + '<div class="concl"><b>一句话结论</b>：整体达标，最大短板是岗位关键词缺失——综合匹配度 72 分。</div>'
    + '<div class="big-score"><span class="num">72</span><span class="unit">/ 100 综合匹配度</span></div>'
    + metric('项目经历', 80, '有 2 段实习，但缺少量化结果')
    + metric('技能匹配', 60, '岗位要求 Aspen Plus，简历未体现')
    + metric('表达规范', 78, '建议项目描述用 STAR 结构')
    + metric('排版格式', 90, '格式规范，无硬伤')
    + '<div class="tip">'
    + '<div><span class="idx">1</span><b>项目经历加量化</b>：把「优化了工艺流程」改成 '
    + '<span class="ex">「通过调整精馏塔回流比，产品纯度从 95% 提升至 99.2%，蒸汽消耗降低 12%」</span></div>'
    + '<div style="margin-top:7px"><span class="idx">2</span><b>补充岗位关键词</b>：JD 中出现 5 次 '
    + '<span class="ex">Aspen Plus</span>，简历中 0 次——这是 HR 和 ATS 的第一道筛子</div>'
    + '<div style="margin-top:7px"><span class="idx">3</span><b>教育背景补成绩</b>：专业排名前 30% 建议写明</div>'
    + '</div>'
    + '<div class="tip" style="background:#eff6ff;border-left-color:#2563eb">'
    + '<b>专业适配度：高</b>　化学工程与工艺 → 工艺工程师属对口岗位。'
    + '建议重点突出：化工原理/反应工程课程基础、Aspen Plus 全流程模拟、HAZOP 等安全规范认知。'
    + '</div>'
    + '<div class="src">📚 依据：简历写作规范库（2.2 量化优先原则 / 第 4 章硬伤清单）· 专业行业岗位对照库（2.1 化学工程与工艺）</div>'
    + '</div>';
}

/* ---------- 场景 2：岗位匹配（表格版，与平台输出一致） ---------- */
function tierOf(score) {
  if (score >= 85) return '<span class="tier ok">优秀</span>';
  if (score >= 70) return '<span class="tier warn">良好</span>';
  return '<span class="tier bad">待改进</span>';
}
function reportJobs() {
  const rows = [
    ['1', '化工工艺工程师', '民营企业 · 重庆长寿', 88, '专业完全对口，化工原理与物料衡算匹配'],
    ['2', '化工研发工程师', '民营企业 · 重庆涪陵', 82, '专业对口，有实验设计基础'],
    ['3', '工艺安全分析师', '外资企业 · 重庆长寿', 76, '专业相关，安全方向需求增长'],
    ['4', '电池测试工程师', '民营企业 · 重庆两江新区', 71, '新能源赛道与化工有交叉']
  ];
  let tbody = '';
  rows.forEach(r => {
    tbody += '<tr>'
      + '<td class="idx">' + r[0] + '</td>'
      + '<td><div class="jn">' + r[1] + '</div><div class="js">' + r[2] + '</div></td>'
      + '<td class="sc">' + r[3] + tierOf(r[3]) + '</td>'
      + '<td>' + r[4] + '</td>'
      + '</tr>';
  });
  return '<div class="report" style="padding:14px 13px">'
    + '<div class="report-title">🔍 为你匹配到 4 个岗位 <span class="tag">化学工程与工艺 · 重庆 · 校招</span></div>'
    + '<div class="concl"><b>一句话结论</b>：专业对口度高、本地岗位充足，最需要补的是 Aspen Plus 与 HAZOP。</div>'
    + '<table class="jobtable"><thead><tr>'
    + '<th>#</th><th>岗位</th><th>匹配度</th><th>关键匹配理由</th>'
    + '</tr></thead><tbody>' + tbody + '</tbody></table>'
    + '<div class="tip" style="background:#fff7ed;border-left-color:#f59e0b">'
    + '<b>前 2 名的差距提示</b><br>'
    + '① 化工工艺工程师：缺 Aspen Plus 全流程模拟、HAZOP 认知<br>'
    + '② 化工研发工程师：缺正交实验设计与 XRD/SEM 表征经历</div>'
    + '<div class="src">📚 依据：岗位 JD 库（65 条，数据截至 2026-09）· '
    + '匹配度 = 专业相关度 40% + 技能命中 35% + 加分技能 10% + 基准 15%<br>'
    + '💡 回复上面的岗位编号（如「1」）可查看岗位详情</div>'
    + '</div>';
}

/* ---------- 场景 2b：岗位详情下钻 ---------- */
function jobDetail(n) {
  const db = {
    '1': ['化工工艺工程师', '民营企业 · 重庆长寿', '8-12万/年',
      '最看重工艺流程模拟能力与现场问题处理经验',
      ['学历 本科 · 校招 · 化学工程与工艺/应用化学',
       '必备技能 化工原理、物料衡算、Aspen Plus、AutoCAD、工艺流程',
       '加分技能 HAZOP、PID 识图、GB50160、设备选型'],
      ['把课程设计写成「完成甲醇合成工段全流程模拟，物料衡算误差 &lt;3%」',
       '把 Aspen Plus 的使用场景写具体：精馏塔参数优化、能耗对比']],
    '2': ['化工研发工程师', '民营企业 · 重庆涪陵', '9-14万/年',
      '最看重实验设计能力与数据整理规范性',
      ['学历 本科及以上 · 校招 · 化学工程与工艺/应用化学/材料类',
       '必备技能 实验设计、正交实验、数据分析、文献调研、Origin',
       '加分技能 XRD、SEM、GC-MS、专利撰写'],
      ['补一段「用正交实验优化配方，把收率从 X 提升到 Y」的经历',
       '把实验数据整理能力写成产出：实验报告、数据处理脚本']],
    '3': ['工艺安全分析师', '外资企业 · 重庆长寿', '10-15万/年',
      '最看重安全规范认知与风险识别能力',
      ['学历 本科 · 校招 · 化学工程与工艺/安全工程',
       '必备技能 安全法规、危险源辨识、HAZOP、风险评估',
       '加分技能 SIL 评估、双重预防机制、注册安全工程师（在考）'],
      ['把课程里的安全相关内容写进简历：化工安全、过程安全分析',
       '补一段风险识别的实践：实验室安全检查、隐患排查']],
    '4': ['电池测试工程师', '民营企业 · 重庆两江新区', '9-13万/年',
      '最看重测试数据采集与分析能力',
      ['学历 本科 · 校招 · 化学工程与工艺/材料类/电气类',
       '必备技能 电池基础知识、测试设备操作、数据采集与分析',
       '加分技能 充放电测试、Excel/Python 数据处理、失效分析'],
      ['补一段设备操作经历，写清测试项目与数据量',
       '把数据分析能力写成产出：处理 X 组数据、输出报告']]
  };
  const d = db[n];
  if (!d) {
    return '第 ' + n + ' 个岗位不在本次匹配结果里哦（本次共 4 个）。回复 1–4 之间的编号即可。';
  }
  let req = '';
  d[4].forEach(x => { req += '· ' + x + '<br>'; });
  let todo = '';
  d[5].forEach((x, i) => { todo += (i + 1) + '. ' + x + '<br>'; });
  return '<div class="report">'
    + '<div class="report-title">📌 ' + d[0] + ' <span class="tag">' + d[1] + '</span></div>'
    + '<div class="concl"><b>一句话结论</b>：' + d[3] + '</div>'
    + '<div style="font-size:12.5px;line-height:1.9"><b>硬性要求</b><br>' + req + '</div>'
    + '<div class="tip"><b>你需要在简历里体现</b><br>' + todo + '</div>'
    + '<div style="font-size:12px;color:#64748b;margin-top:8px">薪资参考：' + d[2]
    + '　数据更新：2026-09</div>'
    + '<div class="src">📚 依据：校内岗位库 岗位编号 ' + n + '</div>'
    + '</div>';
}

/* ---------- 场景 3：模拟面试 ---------- */
function interviewOpening() {
  return '🎤 好的，我们开始一场「化工工艺工程师」岗位的模拟面试。\n\n'
    + '规则：共 5 道题，每题我可以追问 1 次，全部结束后给你一份复盘报告。\n'
    + '中途想退出随时说「结束面试」。\n\n——\n'
    + '第 1 题（自我介绍）\n\n请用 2 分钟做一个自我介绍。';
}

    + '<div class="report-title">🎯 模拟面试复盘 <span class="tag">化工工艺工程师</span></div>'

    + metric('表达', 85, '语速适中，术语使用准确')

    + '<div class="src">📚 依据：面试题库（3.1 化学工程与工艺·精馏塔回流比）· 面试表现四维评分标准</div>'
    + '</div>';
}

/* ---------- 场景 4：政策咨询 ---------- */

  return '<div class="report" style="padding:14px 15px">'
    + '<div class="report-title">📋 三方协议怎么签？</div>'
    + '<div style="font-size:13px;line-height:1.85">'
    + '<b>结论</b>：三方协议是学生、学校、用人单位三方签署的就业确认文件，'

/* ---------- 场景 3b：重练第 N 题 ---------- */
function retryQuestion(n) {
  const bank = {
    '1': ['自我介绍', '请用 2 分钟做一个自我介绍。'],
    '2': ['专业能力', '请解释精馏塔回流比如何影响分离效果与能耗？'],
    '3': ['专业能力', '说说你在课程设计中是怎么做物料衡算的。'],
    '4': ['行为面试', '讲一次你在团队里推动别人配合你的经历。'],
    '5': ['岗位理解', '你为什么选择工艺工程师这个方向？']
  };
  const q = bank[n];
  if (!q) return '本次面试共 5 道题，回复「重练第 1」到「重练第 5」之间的编号即可。';
  const last = {
    '3': ['「回流比越大分离越好」', 62, '只答了一半，没提能耗代价']
  }[n] || ['（本题未作答或已达标）', 78, '结构可以，但缺少量化结果'];
  return '<div class="report">'
    + '<div class="report-title">🔁 重练第 ' + n + ' 题 <span class="tag">' + q[0] + '</span></div>'
    + '<div class="concl"><b>上次回顾</b>：你答的是 ' + last[0] + '，得分 ' + last[1]
    + '，主要问题是 ' + last[2] + '。</div>'
    + '<div style="font-size:13.5px;line-height:1.9"><b>这次我们再来一遍——</b><br><br>' + q[1] + '</div>'
    + '<div class="src">📚 依据：面试题库（' + q[0] + '）· 重练结果将覆盖该题历史记录</div>'
    + '</div>';
}

/* ---------- 场景 5：成长档案 / 进步对比（长期记忆） ---------- */
function progressReport() {
  return '<div class="report">'
    + '<div class="report-title">📈 你的进步 <span class="tag">化工工艺工程师</span></div>'
    + '<div class="concl"><b>一句话结论</b>：两周内技能匹配从 60 提升到 78，量化结果从 1 条增加到 4 条。</div>'
    + metric('技能匹配', 78, '上次 60 → 本次 78，▲+18')
    + metric('项目经历', 84, '上次 72 → 本次 84，▲+12')
    + metric('表达规范', 74, '上次 78 → 本次 74，▼-4（新增内容表述偏冗长）')
    + metric('排版格式', 90, '与上次持平')
    + '<div class="tip" style="background:#f0fdf4;border-left-color:#10b981">'
    + '<b>进步最大的点</b>：项目经历已补充量化结果（本次 4 条），'
    + '「优化接口性能」这类模糊表述全部替换为带数字的句式。</div>'
    + '<div class="tip" style="background:#fff7ed;border-left-color:#f59e0b">'
    + '<b>需要保持注意</b>：新增内容让表达规范从 78 降到 74，'
    + '建议把长句拆成「动作 + 结果」两段。</div>'
    + '<div class="src">📚 依据：长期记忆库（学生成长档案）· 对比区间 2026-09-24 ~ 2026-10-08</div>'
    + '</div>';
}

/* ---------- 场景 6：异常兜底演示（库外问题 / 越界编号 / 空输入） ---------- */
function outOfScope() {
  return '这个问题我暂时没有权威依据，建议直接咨询学校招生就业处，以免信息有误。\n\n'
    + '我可以帮你的是：📄 简历诊断　🔍 岗位匹配　🎤 模拟面试　📋 就业政策咨询。';
}
function badIndex(n) {
  return '本次匹配结果一共 4 个岗位，没有第 ' + n + ' 个哦。回复 1–4 之间的编号即可查看详情。';
}

/* ---------- 场景路由 ---------- */
const SCENES = [
  { keys: ['简历', '诊断', '优化简历', '改简历', 'resume'], run: async () => {
      await showTyping(900);
      addBot('收到，正在解析你的简历…\n\n已提取到：手机号 ✓　邮箱 ✓　技能关键词 6 个　量化结果 1 条　识别模块 4 个');
      await showTyping(900);
      const row = addBot(reportResume(), true);
      animateBars(row);
      await sleep(400);
      addBot('需要我针对某个岗位再细化一次吗？告诉我岗位名称即可。');
  }},
  { keys: ['岗位', '匹配', '找工作', '实习', '招聘', 'job'], run: async () => {
      await showTyping(900);
      addBot('好的，我先从你的话里提取条件：\n专业 = 化学工程与工艺　城市 = 重庆　类型 = 校招\n\n正在查询岗位库…');
      await showTyping(800);
      const row = addBot(reportJobs(), true);
      animateBars(row);
      await sleep(300);
      addBot('想了解某个岗位的详细要求，回复岗位名称即可。');
  }},
  { keys: ['面试', '模拟面试', '练面试', 'interview'], run: async () => {
      await showTyping(900);
      addBot(interviewOpening());
  }},
  { keys: ['三方', '协议', '档案', '报到证', '合同', '试用期', '社保', '应届'], run: async () => {
      await showTyping(800);
      addBot(policyAnswer(), true);
  }},
  { keys: ['重练', '再来一遍', 'retry'], run: async () => {
      await showTyping(800);
      const m = t0.match(/[1-5]/);
      addBot(retryQuestion(m ? m[0] : '3'), true);
  }},
  { keys: ['进步', '成长', '历史', '上次', '记录'], run: async () => {
      await showTyping(900);
      const row = addBot(progressReport(), true);
      animateBars(row);
  }},
  { keys: ['食堂', '天气', '几点开门', '宿舍', '公交'], run: async () => {
      await showTyping(700);
      addBot(outOfScope());
  }}
];

function pickScene(text) {
  const t = text.toLowerCase();
  for (const s of SCENES) if (s.keys.some(k => t.includes(k))) return s;
  return null;
}

/* 数字编号 = 岗位详情下钻（对应 04 §4.7） */
function isJobIndex(text) { return /^\s*[1-9]\d*\s*$/.test(text); }

async function handle(text) {
  if (!text.trim()) return;
  addUser(text);
  inputEl.value = '';
  t0 = text;

  /* 优先判定“岗位编号”，实现下钻闭环 */
  if (isJobIndex(text)) {
    const n = parseInt(text.trim(), 10);
    await showTyping(800);
    addBot(n >= 1 && n <= 4 ? jobDetail(String(n)) : badIndex(n), true);
    return;
  }

  const scene = pickScene(text);
  if (scene) { await scene.run(); }
  else {
    await showTyping(700);
    addBot('我可以帮你做四件事：\n📄 诊断简历　🔍 匹配岗位　🎤 模拟面试　📋 政策咨询\n\n'
      + '点下面的按钮，或者直接告诉我你想找什么岗位。');
  }
}

/* ---------- 初始化 ---------- */
function init() {
  CHIPS.forEach(c => {
    const el = document.createElement('div');
    el.className = 'chip';
    el.textContent = c;
    el.onclick = () => handle(c.replace(/^[^\s]+\s/, ''));
    chipsEl.appendChild(el);
  });
  addBot('你好，我是「职引」👋\n\n我可以帮你做四件事：\n'
    + '📄 诊断简历 —— 把简历发给我，我按目标岗位逐条给你改法\n'
    + '🔍 匹配岗位 —— 告诉我你的专业和意向，我从校内岗位库帮你找\n'
    + '🎤 模拟面试 —— 按目标岗位来一场带追问的实战演练\n'
    + '📋 政策咨询 —— 三方协议、档案、报到证、劳动合同，都能问\n\n'
    + '先告诉我，你这次想找什么岗位？');
  setTimeout(() => addBot('（这是交互原型，点击下方按钮即可预览四个功能的界面效果）'), 500);
}

sendBtn.onclick = () => handle(inputEl.value);
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') handle(inputEl.value); });
init();

</script>
