<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>职引 · 校园就业智能体</title>
<style>
  :root{
    --bg:#f6f8fb; --card:#ffffff; --ink:#0f172a; --sub:#5b6b82; --line:#e6ebf2;
    --brand:#2563eb; --teal:#0ea5a4; --warn:#b45309;
    --r:16px; --shadow:0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.06);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.65;
       -webkit-font-smoothing:antialiased}
  .app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative}
  header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;
         padding:12px 16px;background:rgba(246,248,251,.86);backdrop-filter:saturate(1.2) blur(12px);
         border-bottom:1px solid var(--line)}
  .mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(140deg,var(--teal),var(--brand));
        color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex:0 0 auto}
  .titles{flex:1;min-width:0}
  .titles b{display:block;font-size:15px;letter-spacing:.2px}
  .titles span{display:block;font-size:12px;color:var(--sub)}
  .ghost{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:10px;
         padding:6px 10px;font-size:12px;cursor:pointer}
  .ghost:hover{color:var(--ink);border-color:#cfd8e6}
  main{flex:1;display:flex;flex-direction:column;padding:16px;gap:14px;overflow-y:auto}
  .hello{padding:6px 2px 0}
  .hello h1{margin:0 0 6px;font-size:22px;line-height:1.35;letter-spacing:-.2px}
  .hello p{margin:0;color:var(--sub);font-size:14px}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;
        text-align:left;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s ease,border-color .15s}
  .card:hover{transform:translateY(-1px);border-color:#cfd8e6}
  .card b{display:block;font-size:14px;margin-bottom:2px}
  .card span{display:block;font-size:12px;color:var(--sub);line-height:1.5}
  .card .ico{font-size:17px;display:block;margin-bottom:6px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;
        color:#334155;cursor:pointer;box-shadow:0 1px 2px rgba(15,23,42,.03)}
  .chip:hover{border-color:#c7d2e3;color:var(--ink)}
  .note{font-size:12px;color:var(--sub);padding:2px 2px 0}
  #chat{display:none;flex-direction:column;gap:12px;padding:16px 14px 8px}
  #chat.on{display:flex}
  .row{display:flex;gap:8px;max-width:100%}
  .row.me{justify-content:flex-end}
  .bubble{max-width:86%;padding:11px 13px;border-radius:14px;background:#fff;border:1px solid var(--line);
          box-shadow:var(--shadow);white-space:pre-wrap;word-break:break-word;font-size:14.5px}
  .row.me .bubble{background:linear-gradient(140deg,#2563eb,#1d4ed8);color:#fff;border-color:transparent}
  .bubble h3{margin:12px 0 6px;font-size:14.5px}
  .bubble h4{margin:10px 0 4px;font-size:14px}
  .bubble table{border-collapse:collapse;margin:8px 0;font-size:12.5px;max-width:100%}
  .bubble td,.bubble th{border:1px solid var(--line);padding:5px 7px;white-space:normal;
                        word-break:break-word;vertical-align:top;min-width:56px}
  .bubble th{white-space:nowrap}
  .bubble th{background:#f3f7fd}
  .bubble code{background:#f1f5f9;border-radius:5px;padding:1px 5px;font-size:13px}
  .bubble hr{border:0;border-top:1px dashed var(--line);margin:10px 0}
  .src{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line)}
  .tag{font-size:11.5px;color:#54617a;background:#f4f7fc;border:1px solid var(--line);
       border-radius:999px;padding:2px 8px;line-height:1.7;cursor:help}
  .typing{display:inline-block;width:7px;height:15px;background:var(--brand);border-radius:2px;
          animation:blink 1s steps(2) infinite;vertical-align:-2px;margin-left:3px}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  .progress{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;box-shadow:var(--shadow)}
  .progress .bar{height:6px;background:#eef2f8;border-radius:99px;overflow:hidden;margin-top:6px}
  .progress .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--brand));
                   width:0;transition:width .4s ease}
  .composer{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(246,248,251,0),var(--bg) 30%);
            padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
  .box{display:flex;align-items:flex-end;gap:8px;background:#fff;border:1px solid var(--line);
       border-radius:18px;padding:8px 8px 8px 14px;box-shadow:var(--shadow)}
  textarea{flex:1;border:0;outline:0;resize:none;font-family:inherit;font-size:15px;line-height:1.5;
           max-height:120px;background:transparent;color:var(--ink)}
  textarea::placeholder{color:#9aa7ba}
  .send{flex:0 0 auto;width:34px;height:34px;border:0;border-radius:50%;background:var(--brand);color:#fff;
        font-size:16px;cursor:pointer;display:grid;place-items:center}
  .send[disabled]{background:#c7d2e3;cursor:not-allowed}
  .err{background:#fff7ed;border:1px solid #fed7aa;color:var(--warn);border-radius:12px;
       padding:9px 12px;font-size:13px;display:flex;justify-content:space-between;gap:10px}
  .err button{border:0;background:transparent;color:var(--warn);text-decoration:underline;cursor:pointer}
  .foot{text-align:center;font-size:11px;color:#93a1b5;padding:6px 0 0}
  @media (max-width:430px){
    header{padding:10px 12px;gap:8px}
    .titles span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ghost{padding:5px 9px;font-size:11.5px}
  }
  @media (min-width:560px){ .app{box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(15,23,42,.06)} }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="mark">职</div>
    <div class="titles">
      <b>职引 · 校园就业智能体</b>
      <span id="sub">简历诊断 · 岗位匹配 · 模拟面试 · 政策咨询</span>
    </div>
    <button class="ghost" id="exportBtn">导出</button>
    <button class="ghost" id="newChat">新对话</button>
  </header>

  <main id="home">
    <div class="hello">
      <h1>先把事儿说清楚，<br>再给你能照做的答案。</h1>
      <p>重庆理工大学 · 面向重庆高校应届生。你的简历只用于本次分析，不落库、不留存。</p>
    </div>
    <div class="cards">
      <button class="card" data-q="帮我看看我的简历有什么问题"><span class="ico">📄</span><b>简历诊断</b><span>按目标岗位逐条改，标出缺口</span></button>
      <button class="card" data-q="我是化学工程与工艺专业大四，想在重庆找校招岗位"><span class="ico">🔍</span><b>岗位匹配</b><span>从校内岗位库挑对口岗</span></button>
      <button class="card" data-q="来一场模拟面试，目标岗位是化工工艺工程师"><span class="ico">🎤</span><b>模拟面试</b><span>5 题追问 + 四维复盘</span></button>
      <button class="card" data-q="三方协议怎么签"><span class="ico">📋</span><b>政策咨询</b><span>三方 / 档案 / 补贴 / 劳动</span></button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="note">回答由大模型生成，政策口径仅供参考；关键决定前请以官方文件与学校就业指导中心为准。</div>
  </main>

  <section id="chat"></section>

  <div class="composer">
    <div class="box">
      <textarea id="input" rows="1" placeholder="说说你的情况，或直接提问…"></textarea>
      <button class="send" id="send" aria-label="发送">↑</button>
    </div>
    <div class="foot">上下文会随每轮自动带上</div>
  </div>
</div>
<script>
const API = "https://aiagent.cqut.edu.cn:31134/v1/chat-messages";
const KEY = "app-8PKbSyrPSFnPGjQ5AQX6u1Zl";   /* 公开静态页专用密钥（应用 v19），可随时在控制台吊销 */
const STORE = "zhiyin.v1";
const PRESET = ["帮我诊断简历","帮我匹配岗位","来一场模拟面试","三方协议怎么签？",
  "我是化工学院大三，想找重庆的校招岗位","帮我把项目经历改写得更专业",
  "我投了简历没回音，问题可能在哪","档案和报到证有什么区别"];

const $ = (s) => document.querySelector(s);
const state = load();

function load(){
  try{
    const s = JSON.parse(localStorage.getItem(STORE) || "{}");
    return { cid: s.cid || "", uid: s.uid || ("u" + Math.random().toString(36).slice(2,10)),
             msgs: Array.isArray(s.msgs) ? s.msgs : [], progress: s.progress || 0 };
  }catch(e){ return { cid:"", uid:"u"+Math.random().toString(36).slice(2,10), msgs:[], progress:0 }; }
}
function save(){ localStorage.setItem(STORE, JSON.stringify(state)); }

/* 把用户此前说过的话压成一段历史，随 inputs.ctx 每轮带上（平台本身不给历史） */
function ctxOf(){
  const said = state.msgs.filter(m => m.role === "me").slice(-3)
    .map(m => (m.text || "").replace(/\s+/g, " ").slice(0, 90)).filter(Boolean);
  return said.length ? "〔历史〕用户此前说过：" + said.join("；") + "。" : "";
}

function esc(s){ return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function md(t){
  let s = esc(t);
  s = s.replace(/^### (.*)$/gm, "<h4>$1</h4>").replace(/^## (.*)$/gm, "<h3>$1</h3>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  s = s.replace(/\u0060([^\u0060]+)\u0060/g, "<code>$1</code>");
  s = s.replace(/^\s*---+\s*$/gm, "<hr>");
  s = s.replace(/(?:^\|.*\|\s*$\n?)+/gm, function(block){
    const rows = block.trim().split("\n").map(r => r.split("|").slice(1,-1).map(c => c.trim()));
    const body = rows.filter(r => !r.every(c => /^:?-{2,}:?$/.test(c) || c === ""));
    if (body.length < 2) return block;
    const head = body.shift();
    let html = "<table><thead><tr>" + head.map(c => "<th>" + c + "</th>").join("") + "</tr></thead><tbody>";
    body.forEach(r => { html += "<tr>" + r.map(c => "<td>" + c + "</td>").join("") + "</tr>"; });
    return html + "</tbody></table>";
  });
  return s;
}

/* 答案里的引用来源：metadata.retriever_resources -> 「岗位库 ×5」这样的标签 */
const KBLABEL = { KB1:"简历规范库", KB2:"面试题库", KB3:"专业岗位对照",
                  KB4:"岗位库", KB5:"政策库", KB6:"常见问答" };
function kbName(n){
  if (!n) return "知识库";
  const m = n.match(/^(KB\d)/i);
  if (m && KBLABEL[m[1].toUpperCase()]) return KBLABEL[m[1].toUpperCase()];
  return n.replace(/^KB\d[-·]?/i, "").slice(0, 12) || n;
}
function srcOf(res){
  const map = {};
  (res || []).forEach(function(r){
    const n = kbName(r.dataset_name);
    const s = Number(r.score) || 0;
    if (!map[n]) map[n] = { n: n, c: 0, s: 0 };
    map[n].c++;
    if (s > map[n].s) map[n].s = s;
  });
  return Object.keys(map).map(function(k){ return map[k]; })
    .sort(function(a, b){ return b.s - a.s; });
}
function srcHtml(src){
  if (!src || !src.length) return "";
  return '<div class="src">' + src.map(function(x){
    return '<span class="tag" title="命中 ' + x.c + ' 段，最高匹配 ' + x.s.toFixed(2)
      + '">📚 ' + esc(x.n) + ' ×' + x.c + '</span>';
  }).join("") + '</div>';
}
function attachSrc(bubble, src){
  if (src && src.length) bubble.insertAdjacentHTML("beforeend", srcHtml(src));
}

function renderMsg(role, text, src){
  const row = document.createElement("div");
  row.className = "row " + (role === "me" ? "me" : "bot");
  const b = document.createElement("div");
  b.className = "bubble";
  b.innerHTML = role === "me" ? esc(text) : md(text);
  row.appendChild(b);
  $("#chat").appendChild(row);
  if (role !== "me") attachSrc(b, src);
  scroll();
  return b;
}
function addMsg(role, text){
  state.msgs.push({ role: role, text: text });
  if (state.msgs.length > 40) state.msgs = state.msgs.slice(-40);
  save();
  return renderMsg(role, text);
}
function scroll(){ const m = $("#chat"); if (m.lastElementChild) m.lastElementChild.scrollIntoView({block:"end",behavior:"smooth"}); }

function setProgress(n){
  state.progress = n; save();
  let el = document.getElementById("pv");
  if (!n){ if (el) el.remove(); return; }
  if (!el){ el = document.createElement("div"); el.id = "pv"; el.className = "progress"; $("#chat").appendChild(el); }
  el.innerHTML = '<div style="display:flex;justify-content:space-between;font-size:12px;color:#5b6b82">'
    + '<span>模拟面试进度</span><b>' + n + ' / 5</b></div><div class="bar"><i style="width:'
    + Math.min(100, n / 5 * 100) + '%"></i></div>';
}
function scanProgress(t){
  const m = t.match(/面试进度[：:]\s*(\d)\s*\/\s*5/);
  if (m) setProgress(parseInt(m[1], 10));
}

function typeOut(el, text){
  if (!text){ el.innerHTML = md("（这次没有生成内容，换个说法再试一次）"); return Promise.resolve(); }
  /* 长答案直接整段渲染：逐帧重建大表格既慢又容易在中间态抛错 */
  if (text.length > 900){
    try { el.innerHTML = md(text); } catch(e){ el.textContent = text; }
    scroll();
    return Promise.resolve();
  }
  return new Promise(function(done){
    let i = 0;
    const step = Math.max(10, Math.ceil(text.length / 40));
    const timer = setInterval(function(){
      try{
        i = Math.min(text.length, i + step);
        el.innerHTML = md(text.slice(0, i)) + (i < text.length ? '<span class="typing"></span>' : "");
        scroll();
      } catch(e){
        el.textContent = text; clearInterval(timer); return done();
      }
      if (i >= text.length){ clearInterval(timer); done(); }
    }, 22);
  });
}

let busy = false;
async function send(text){
  text = (text || "").trim();
  if (!text || busy) return;
  busy = true; $("#send").disabled = true;
  $("#home").style.display = "none"; $("#chat").classList.add("on");
  $("#sub").textContent = "回答中…";

  addMsg("me", text);
  const ctx = ctxOf();
  const bubble = renderMsg("bot", "");
  bubble.innerHTML = '<span class="typing"></span>';
  let buf = "";

  /* 本 fork 的 /v1 在 streaming 模式下只回一个事件，blocking 才拿得到完整答案；
     打字机效果改在本地做，体验不变。 */
  const body = { inputs: { user_input: text, ctx: ctx }, query: text,
                 response_mode: "blocking", conversation_id: state.cid || "", user: state.uid };
  const t0 = Date.now();
  const tick = setInterval(function(){
    bubble.innerHTML = '<span style="color:#8b98ab;font-size:13px">思考中 '
      + Math.round((Date.now() - t0) / 1000) + 's</span><span class="typing"></span>';
    scroll();
  }, 600);

  try{
    const res = await fetch(API, { method:"POST",
      headers:{ "Authorization":"Bearer " + KEY, "Content-Type":"application/json" },
      body: JSON.stringify(body) });
    if (!res.ok) throw new Error("HTTP " + res.status + " " + (await res.text()).slice(0,120));
    const j = await res.json();
    clearInterval(tick);
    if (j.conversation_id){ state.cid = j.conversation_id; save(); }
    if (j.event === "error") throw new Error(j.message || "模型返回错误");
    buf = j.answer || "";
    const src = srcOf(((j.metadata || {}).retriever_resources) || []);
    try { await typeOut(bubble, buf); }
    catch(e){ bubble.textContent = buf || "（渲染失败，原文见上）"; }
    attachSrc(bubble, src);
    scanProgress(buf);
    if (buf) { state.msgs.push({ role:"bot", text: buf, src: src }); save(); }
  } catch (e){
    clearInterval(tick);
    bubble.remove();
    const err = document.createElement("div");
    err.className = "err";
    err.innerHTML = '<span>请求失败：' + esc(String(e.message || e)).slice(0,90)
      + '</span><button>重试</button>';
    $("#chat").appendChild(err);
    err.querySelector("button").onclick = function(){ err.remove(); state.msgs.pop(); save(); send(text); };
  } finally {
    busy = false; $("#send").disabled = false;
    $("#sub").textContent = "简历诊断 · 岗位匹配 · 模拟面试 · 政策咨询";
    scroll();
  }
}

$("#send").onclick = function(){ const t = $("#input").value; $("#input").value = ""; $("#input").style.height="auto"; send(t); };
$("#input").addEventListener("keydown", function(e){
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); $("#send").click(); }
});
$("#input").addEventListener("input", function(e){
  e.target.style.height = "auto"; e.target.style.height = Math.min(120, e.target.scrollHeight) + "px";
});
Array.prototype.forEach.call(document.querySelectorAll(".card"), function(c){ c.onclick = function(){ send(c.dataset.q); }; });
$("#chips").innerHTML = PRESET.map(function(q){ return '<button class="chip">' + esc(q) + '</button>'; }).join("");
Array.prototype.forEach.call(document.querySelectorAll(".chip"), function(c){ c.onclick = function(){ send(c.textContent); }; });
/* 导出成 Markdown：学生可以把诊断结果直接给老师看，也方便留档 */
function exportMd(){
  if (!state.msgs.length){ alert("还没有对话内容可以导出"); return; }
  const lines = ["# 职引 · 会话记录", "",
                 "导出时间：" + new Date().toLocaleString("zh-CN"), ""];
  state.msgs.forEach(function(m){
    lines.push(m.role === "me" ? "## 我" : "## 职引", "", (m.text || "").trim(), "");
    if (m.src && m.src.length){
      lines.push("> 参考：" + m.src.map(function(x){ return x.n + " ×" + x.c; }).join("、"), "");
    }
  });
  const blob = new Blob([lines.join("\n")], { type: "text/markdown;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "职引-会话-" + new Date().toISOString().slice(0, 10) + ".md";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
}
$("#exportBtn").onclick = exportMd;

$("#newChat").onclick = function(){
  if (state.msgs.length && !confirm("清空当前对话？")) return;
  localStorage.removeItem(STORE); location.reload();
};

if (state.msgs.length){
  $("#home").style.display = "none"; $("#chat").classList.add("on");
  state.msgs.forEach(function(m){ renderMsg(m.role, m.text, m.src); });
  if (state.progress) setProgress(state.progress);
  scroll();
}
</script>
</body>
</html>
